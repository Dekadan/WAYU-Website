# Content panel behind /admin (Sveltia CMS, Decap-compatible config).
#
# Content is committed straight to the GitHub repository, so the panel needs
# no database and no server. Editors sign in with a GitHub account that has
# write access to Dekadan/WAYU-Website ("Sign In with GitHub", via the
# wayu-cms-auth Worker), and every save is a commit; Cloudflare Workers
# Builds rebuilds and deploys the site from main.

backend:
  name: github
  repo: Dekadan/WAYU-Website
  branch: main
  base_url: https://wayu-cms-auth.bvu-dizin.workers.dev
  # The repository is public, so sign-in asks only for public-repo access
  # and leaves editors' private repositories out of the token.
  auth_scope: public_repo
  commit_messages:
    create: 'content: create {{collection}} "{{slug}}"'
    update: 'content: update {{collection}} "{{slug}}"'
    delete: 'content: delete {{collection}} "{{slug}}"'
    uploadMedia: 'content: upload {{path}}'
    deleteMedia: 'content: delete {{path}}'

# Lets `npm run cms` edit local files while `npm run dev` is running.
local_backend: true


media_folder: public/uploads
public_folder: /uploads

i18n:
  # Writes `src/content/<collection>/<locale>/<slug>.md`, which is exactly the
  # layout src/content.config.ts reads back.
  structure: multiple_folders
  locales: [en, tr, ar, es, ru, it, fr, pt, fa, zh]
  default_locale: en
  # A post may be published in English only; the site shows the English
  # original in the other languages until a translation is added.
  save_all_locales: false

locale: en

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  # ------------------------------------------------------------- Statements
  - name: statements
    label: Statements
    label_singular: Statement
    description: Official positions of WAYU and its member organisations.
    folder: src/content/statements
    create: true
    slug: '{{slug}}'
    i18n: true
    preview_path: 'statements/{{slug}}'
    summary: '{{title}} — {{date | date("YYYY-MM-DD")}}'
    sortable_fields: [date, title]
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
      - { label: Featured, field: featured, pattern: true }
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - {
          name: description,
          label: Summary,
          widget: text,
          required: false,
          i18n: true,
          hint: 'One paragraph. Used in listings, search results and link previews.',
        }
      - { name: date, label: Date, widget: datetime, date_format: DD.MM.YYYY, time_format: false, format: 'YYYY-MM-DD', i18n: duplicate }
      - {
          name: issuedBy,
          label: Issued by,
          widget: string,
          required: false,
          i18n: true,
          hint: 'The body that took the decision, e.g. WAYU Executive Committee.',
        }
      - {
          name: signatories,
          label: Signatories,
          widget: list,
          required: false,
          i18n: true,
          field: { name: name, label: Organisation, widget: string },
        }
      - { name: image, label: Image, widget: image, required: false, i18n: duplicate }
      - { name: imageAlt, label: Image description, widget: string, required: false, i18n: true, hint: What a screen reader announces in place of the image. }
      - { name: imageCredit, label: Photo credit, widget: string, required: false, i18n: duplicate, hint: 'Only for photos that need attribution, e.g. Photo: Name / Wikimedia Commons, CC BY 4.0' }
      - { name: tags, label: Tags, widget: list, required: false, i18n: true }
      - { name: featured, label: Pin to homepage, widget: boolean, default: false, i18n: duplicate }
      - { name: draft, label: Draft (not published), widget: boolean, default: false, i18n: duplicate }
      - { name: body, label: Text, widget: markdown, i18n: true }

  # --------------------------------------------------------------- Articles
  - name: articles
    label: Articles
    label_singular: Article
    description: Analysis and opinion, published under an author's name.
    folder: src/content/articles
    create: true
    slug: '{{slug}}'
    i18n: true
    preview_path: 'articles/{{slug}}'
    summary: '{{title}} — {{date | date("YYYY-MM-DD")}}'
    sortable_fields: [date, title]
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
      - { label: Featured, field: featured, pattern: true }
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: description, label: Summary, widget: text, required: false, i18n: true }
      - { name: date, label: Date, widget: datetime, date_format: DD.MM.YYYY, time_format: false, format: 'YYYY-MM-DD', i18n: duplicate }
      - {
          name: author,
          label: Author,
          widget: relation,
          collection: authors,
          search_fields: [name],
          value_field: '{{slug}}',
          display_fields: [name],
          required: false,
          i18n: duplicate,
          hint: Pick a profile from the Authors section. Add the author there first.,
        }
      - { name: image, label: Image, widget: image, required: false, i18n: duplicate }
      - { name: imageAlt, label: Image description, widget: string, required: false, i18n: true }
      - { name: imageCredit, label: Photo credit, widget: string, required: false, i18n: duplicate, hint: 'Only for photos that need attribution, e.g. Photo: Name / Wikimedia Commons, CC BY 4.0' }
      - { name: tags, label: Tags, widget: list, required: false, i18n: true }
      - {
          name: originalSource,
          label: Original source,
          widget: string,
          required: false,
          i18n: true,
          hint: Fill in only when the text was first published elsewhere.,
        }
      - { name: originalSourceUrl, label: Original source URL, widget: string, required: false, i18n: duplicate, pattern: ['^https?://.+', 'Must start with http:// or https://'] }
      - { name: featured, label: Pin to homepage, widget: boolean, default: false, i18n: duplicate }
      - { name: draft, label: Draft (not published), widget: boolean, default: false, i18n: duplicate }
      - { name: body, label: Text, widget: markdown, i18n: true }

  # ------------------------------------------------------------------- News
  - name: news
    label: News
    label_singular: News item
    description: Short reports on developments worth following.
    folder: src/content/news
    create: true
    slug: '{{slug}}'
    i18n: true
    preview_path: 'news/{{slug}}'
    summary: '{{title}} — {{date | date("YYYY-MM-DD")}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: description, label: Summary, widget: text, required: false, i18n: true }
      - { name: date, label: Date, widget: datetime, date_format: DD.MM.YYYY, time_format: false, format: 'YYYY-MM-DD', i18n: duplicate }
      - { name: location, label: Location, widget: string, required: false, i18n: true }
      - { name: source, label: Source, widget: string, required: false, i18n: true }
      - { name: sourceUrl, label: Source URL, widget: string, required: false, i18n: duplicate, pattern: ['^https?://.+', 'Must start with http:// or https://'] }
      - { name: image, label: Image, widget: image, required: false, i18n: duplicate }
      - { name: imageAlt, label: Image description, widget: string, required: false, i18n: true }
      - { name: imageCredit, label: Photo credit, widget: string, required: false, i18n: duplicate, hint: 'Only for photos that need attribution, e.g. Photo: Name / Wikimedia Commons, CC BY 4.0' }
      - { name: tags, label: Tags, widget: list, required: false, i18n: true }
      - { name: featured, label: Pin to homepage, widget: boolean, default: false, i18n: duplicate }
      - { name: draft, label: Draft (not published), widget: boolean, default: false, i18n: duplicate }
      - { name: body, label: Text, widget: markdown, i18n: true }

  # -------------------------------------------------------------- Documents
  - name: documents
    label: Documents
    label_singular: Document
    description: Constitution, declarations, congress resolutions and reports.
    folder: src/content/documents
    create: true
    slug: '{{slug}}'
    i18n: true
    preview_path: 'documents/{{slug}}'
    summary: '{{order}} · {{title}}'
    sortable_fields: [order, date, title]
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: description, label: Summary, widget: text, required: false, i18n: true }
      - { name: date, label: Date adopted, widget: datetime, date_format: DD.MM.YYYY, time_format: false, format: 'YYYY-MM-DD', i18n: duplicate }
      - {
          name: kind,
          label: Type,
          widget: select,
          default: declaration,
          i18n: duplicate,
          options:
            [
              { label: Constitution, value: constitution },
              { label: Declaration, value: declaration },
              { label: Resolution, value: resolution },
              { label: Programme, value: programme },
              { label: Report, value: report },
            ],
        }
      - {
          name: order,
          label: Order,
          widget: number,
          default: 100,
          value_type: int,
          i18n: duplicate,
          hint: Lower numbers appear first. The constitution is 1.,
        }
      - { name: file, label: PDF version, widget: file, required: false, i18n: duplicate, hint: Optional. Adds a download button at the top of the page. }
      - { name: image, label: Image, widget: image, required: false, i18n: duplicate }
      - { name: imageAlt, label: Image description, widget: string, required: false, i18n: true }
      - { name: imageCredit, label: Photo credit, widget: string, required: false, i18n: duplicate, hint: 'Only for photos that need attribution, e.g. Photo: Name / Wikimedia Commons, CC BY 4.0' }
      - { name: tags, label: Tags, widget: list, required: false, i18n: true }
      - { name: featured, label: Pin to homepage, widget: boolean, default: false, i18n: duplicate }
      - { name: draft, label: Draft (not published), widget: boolean, default: false, i18n: duplicate }
      - { name: body, label: Text, widget: markdown, i18n: true }

  # ---------------------------------------------------------------- Authors
  - name: authors
    label: Authors
    label_singular: Author
    description: Contributor profiles. Create one before assigning an article.
    folder: src/content/authors
    create: true
    slug: '{{slug}}'
    i18n: true
    preview_path: 'authors/{{slug}}'
    summary: '{{name}} — {{organization}}'
    sortable_fields: [name]
    fields:
      - { name: name, label: Name, widget: string, i18n: true }
      - { name: role, label: Role, widget: string, required: false, i18n: true }
      - { name: organization, label: Organisation, widget: string, required: false, i18n: true }
      - { name: country, label: Country, widget: string, required: false, i18n: true }
      - { name: bio, label: Short biography, widget: text, required: false, i18n: true, hint: 'One or two sentences, shown on cards and under the byline.' }
      - { name: avatar, label: Photograph, widget: image, required: false, i18n: duplicate }
      - { name: website, label: Website, widget: string, required: false, i18n: duplicate, pattern: ['^https?://.+', 'Must start with http:// or https://'] }
      - { name: draft, label: Hidden, widget: boolean, default: false, i18n: duplicate }
      - { name: body, label: Long biography, widget: markdown, required: false, i18n: true }

  # ------------------------------------------------------------------ Pages
  # Standing pages have fixed routes, so they are edited as named files rather
  # than created freely. Each language is its own entry.
  - name: pages
    label: Pages
    description: The About and Join Us pages.
    editor: { preview: false }
    files:
      - name: about_en
        label: About WAYU — English
        file: src/content/pages/en/about.md
        preview_path: about
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Summary, widget: text, hint: Also shown in the dark band on the homepage. }
          - { name: image, label: Image, widget: image, required: false }
          - { name: imageAlt, label: Image description, widget: string, required: false }
          - { name: imageCredit, label: Photo credit, widget: string, required: false, i18n: duplicate, hint: 'Only for photos that need attribution, e.g. Photo: Name / Wikimedia Commons, CC BY 4.0' }
          - {
              name: stats,
              label: Key figures,
              widget: list,
              required: false,
              fields:
                [
                  { name: value, label: Figure, widget: string },
                  { name: label, label: Caption, widget: string },
                ],
            }
          - {
              name: highlights,
              label: Highlight blocks,
              widget: list,
              required: false,
              fields:
                [
                  { name: title, label: Title, widget: string },
                  { name: body, label: Text, widget: text },
                ],
            }
          - { name: body, label: Text, widget: markdown }

      - name: about_tr
        label: WAYU Nedir — Türkçe
        file: src/content/pages/tr/about.md
        preview_path: tr/about
        fields:
          - { name: title, label: Başlık, widget: string }
          - { name: description, label: Özet, widget: text, hint: Anasayfadaki koyu bantta da gösterilir. }
          - { name: image, label: Görsel, widget: image, required: false }
          - { name: imageAlt, label: Görsel açıklaması, widget: string, required: false }
          - { name: imageCredit, label: Photo credit, widget: string, required: false, i18n: duplicate, hint: 'Only for photos that need attribution, e.g. Photo: Name / Wikimedia Commons, CC BY 4.0' }
          - {
              name: stats,
              label: Rakamlar,
              widget: list,
              required: false,
              fields:
                [
                  { name: value, label: Rakam, widget: string },
                  { name: label, label: Açıklama, widget: string },
                ],
            }
          - {
              name: highlights,
              label: Öne çıkan bloklar,
              widget: list,
              required: false,
              fields:
                [
                  { name: title, label: Başlık, widget: string },
                  { name: body, label: Metin, widget: text },
                ],
            }
          - { name: body, label: Metin, widget: markdown }

      - name: join_en
        label: Join Us — English
        file: src/content/pages/en/join.md
        preview_path: join
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Summary, widget: text }
          - { name: image, label: Image, widget: image, required: false }
          - { name: imageAlt, label: Image description, widget: string, required: false }
          - { name: imageCredit, label: Photo credit, widget: string, required: false, i18n: duplicate, hint: 'Only for photos that need attribution, e.g. Photo: Name / Wikimedia Commons, CC BY 4.0' }
          - {
              name: highlights,
              label: Highlight blocks,
              widget: list,
              required: false,
              fields:
                [
                  { name: title, label: Title, widget: string },
                  { name: body, label: Text, widget: text },
                ],
            }
          - { name: body, label: Text, widget: markdown }

      - name: join_tr
        label: Bize Katıl — Türkçe
        file: src/content/pages/tr/join.md
        preview_path: tr/join
        fields:
          - { name: title, label: Başlık, widget: string }
          - { name: description, label: Özet, widget: text }
          - { name: image, label: Görsel, widget: image, required: false }
          - { name: imageAlt, label: Görsel açıklaması, widget: string, required: false }
          - { name: imageCredit, label: Photo credit, widget: string, required: false, i18n: duplicate, hint: 'Only for photos that need attribution, e.g. Photo: Name / Wikimedia Commons, CC BY 4.0' }
          - {
              name: highlights,
              label: Öne çıkan bloklar,
              widget: list,
              required: false,
              fields:
                [
                  { name: title, label: Başlık, widget: string },
                  { name: body, label: Metin, widget: text },
                ],
            }
          - { name: body, label: Metin, widget: markdown }

  # ---------------------------------------------------------------- History
  - name: history
    label: History
    label_singular: Event
    description: WAYU's own record. One entry per event; they appear on /history oldest first.
    folder: src/content/history
    create: true
    slug: '{{year}}-{{slug}}'
    i18n: true
    preview_path: 'history'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: date, label: Date, widget: datetime, date_format: DD.MM.YYYY, time_format: false, format: 'YYYY-MM-DD', i18n: duplicate, hint: Used for ordering. }
      - { name: dateLabel, label: Date as shown, widget: string, required: false, i18n: true, hint: 'Only when the exact day is unknown or it is a range, e.g. "2020" or "17–23 March 2018".' }
      - { name: place, label: Place, widget: string, required: false, i18n: true }
      - { name: image, label: Main photo, widget: image, required: false, i18n: duplicate }
      - { name: imageAlt, label: Photo description, widget: string, required: false, i18n: true }
      - { name: imageCredit, label: Photo credit, widget: string, required: false, i18n: duplicate, hint: 'Only for photos that need attribution, e.g. Photo: Name / Wikimedia Commons, CC BY 4.0' }
      - name: gallery
        label: More photos
        widget: list
        required: false
        i18n: true
        fields:
          - { name: src, label: Photo, widget: image }
          - { name: alt, label: Photo description, widget: string, required: false }
          - { name: caption, label: Caption, widget: string, required: false }
      - { name: draft, label: Draft (not published), widget: boolean, default: false, i18n: duplicate }
      - { name: body, label: Text, widget: markdown, required: false, i18n: true }
